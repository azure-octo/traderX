name: Deploy Docusaurus (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install website dependencies
        run: npm --prefix website ci --no-audit --no-fund

      - name: Build Docusaurus site
        env:
          DOCUSAURUS_URL: https://traderx.finos.org
          DOCUSAURUS_BASE_URL: /
        run: |
          TRADERX_SITE_ROOT="${DOCUSAURUS_BASE_URL%/}" bash pipeline/refresh-state-docs.sh
          npm --prefix website run clear
          npm --prefix website run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Setup Node for AFDocs
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Run AFDocs on published GitHub Pages URL
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "[info] checking published docs at ${PUBLISHED_URL}"
          SUCCESS=0
          for attempt in $(seq 1 10); do
            if npx --yes afdocs check "${PUBLISHED_URL}" --format scorecard; then
              if npx --yes afdocs check "${PUBLISHED_URL}" --format json --score > afdocs-score-published.json; then
                SUCCESS=1
                break
              fi
            fi
            echo "[warn] AFDocs check failed on attempt ${attempt}, retrying..."
            sleep 15
          done
          if [ "$SUCCESS" -eq 0 ]; then
            echo '{"status":"error","message":"AFDocs check failed after retries"}' > afdocs-score-published.json
            echo "[warn] AFDocs checks failed after retries (non-blocking in deploy workflow)."
          fi

      - name: Upload AFDocs published score artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: afdocs-published-score
          path: afdocs-score-published.json
          if-no-files-found: warn
